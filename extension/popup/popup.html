<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N.ext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header class="header">
    <img src="../assets/lion.jpg" alt="N.ext logo" class="logo" />
    <div class="header-text">
      <span class="brand-name">N.EXT</span>
      <span class="tagline">Your Canvas, evolved</span>
    </div>
  </header>

  <!-- nav bar -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="deadlines">Deadlines</button>
    <button class="tab-btn" data-tab="downloads">Downloads</button>
    <button class="tab-btn" data-tab="site">Site</button>
  </nav>

  <main class="panels">
    <section id="panel-deadlines" class="panel active">

      <div class="setting-row">
        <div class="setting-label-group">
          <span class="setting-label">Deadline Alerts</span>
          <span class="setting-sub">Show upcoming deadlines on your dashboard cards.</span>
        </div>
        <button class="toggle" data-key="isEnabledDeadline" role="switch" aria-checked="true">
          <span class="toggle-knob"></span>
        </button>
      </div>

      <div class="sliders-group" id="sliders-group">

        <div class="slider-block">
          <div class="slider-head">
            <label class="slider-label" for="slider-days">Look Ahead</label>
            <span class="slider-value"><span id="val-days">30</span> days</span>
          </div>
          <input
            type="range"
            id="slider-days"
            class="slider"
            data-key="LookAheadDays"
            min="5" max="100" value="30"
          />
        </div>

        <div class="slider-block">
          <div class="slider-head">
            <label class="slider-label" for="slider-per-subject">Customise Deadlines Per Subject</label>
            <span class="slider-value"><span id="val-per-subject">3</span></span>
          </div>
          <input
            type="range"
            id="slider-per-subject"
            class="slider"
            data-key="MaxDeadlines"
            min="1" max="10" value="3"
          />
        </div>

      </div>
    </section>
<!-- downloads portion for popup-->
    <section id="panel-downloads" class="panel">
      <div class="coming-soon">
        <div class="coming-soon-icon">&#8681;</div>
        <p class="coming-soon-tile">Coming soon</p>
        <p class="coming-soon-sub">Auto-download study materials from Canvas.</p>
      </div>
    </section>
    <section id="panel-site" class="panel">
      <div class="setting-row">
        <div class="setting-label-group">
          <span class="setting-label">NUS theme</span>
          <span class="setting-sub">Turn off to restore Canvas's default look.</span>
        </div>
        <button class="toggle" data-key="DisableUI" role="switch" aria-checked="true">
          <span class="toggle-knob"></span>
        </button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Version 1.0.0</span>
    <span class="footer-sep">·</span>
    <a class="bug-link" href="https://github.com/anushakamran06" target="_blank" rel="noopener">Bug Reports
      <svg class="gh-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
        1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
        0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
        0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0
        .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
  </a>
</footer>

  <script src="popup.js" defer></script>
</body>
</html>
