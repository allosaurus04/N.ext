name: version control

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  lint: # code quality
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: run eslint
        run: npx eslint .

      - name: check manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"

      - name: check version consistency
        run: |
          manifest_version=$(node -p "require('./extension/manifest.json').version")
          package_version=$(node -p "require('./package.json').version")

          if [ "$manifest_version" != "$package_version" ]; then
            echo "Version mismatch detected!"
            echo "Manifest version: $manifest_version"
            echo "Package version: $package_version"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check tag
        run: |
          tag_version=${GITHUB_REF#refs/tags/v}
          manifest_version=$(node -p "require('./extension/manifest.json').version")
          package_version=$(node -p "require('./package.json').version")

          if [ "$tag_version" != "$manifest_version" ] || [ "$tag_version" != "$package_version" ]; then
            echo "Tag does not match manifest.json or package.json!"
            echo "Tag: $tag_version"
            echo "Manifest: $manifest_version"
            echo "Package: $package_version"
            exit 1
          fi

      - name: package ext
        run: |
          cd extension
          zip -r "../n.ext-${GITHUB_REF_NAME}.zip" . -x "*.DS_Store"

      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          files: n.ext-*.zip
          generate_release_notes: true